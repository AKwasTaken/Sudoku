<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#fbfbfc" />
    <title>Sudoku</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="favicon.png" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/board.css" />
    <link rel="stylesheet" href="css/controls.css" />
  </head>
  <body>
    <main class="app">
      <header class="top">
        <svg
          id="logo"
          class="logo"
          viewBox="-0.06 -0.06 4.78 1.16"
          role="img"
          aria-label="sudoku"
        ></svg>
        <span id="time" class="time">00:00</span>
      </header>
      <div class="meta">
        <span id="id" class="id"></span>
        <div class="meta-right">
          <select id="diff" aria-label="Difficulty">
            <option value="easy">Easy</option>
            <option value="medium">Medium</option>
            <option value="hard">Hard</option>
          </select>
          <button id="new">New</button>
        </div>
      </div>
      <div id="board" class="board"></div>
      <p id="status" class="status" aria-live="polite"></p>
      <footer class="tools">
        <button id="notes" aria-pressed="false">Notes</button>
        <button id="erase">Erase</button>
        <button id="save" data-fmt="pdf">PDF</button>
      </footer>
    </main>
    <script src="js/vendor/qrcode.js"></script>
    <script src="js/config.js"></script>
    <script src="js/rng.js"></script>
    <script src="js/generator.js"></script>
    <script src="js/codec.js"></script>
    <script src="js/url.js"></script>
    <script src="js/board.js"></script>
    <script src="js/ring.js"></script>
    <script src="js/print/glyphs.js"></script>
    <script src="js/print/layout.js"></script>
    <script src="js/print/canvas.js"></script>
    <script src="js/print/pdf.js"></script>
    <script src="js/print/export.js"></script>
    <script src="js/game.js"></script>
  </body>
</html>
